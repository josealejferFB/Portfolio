<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>probe</title><link rel="stylesheet" href="../_shared/kit.css">
<style>
body{display:grid;grid-template-columns:var(--panel) 1fr;min-height:100svh}
.p{position:relative;border-radius:var(--r-panel) var(--r-panel) 0 0;color:var(--papel);display:flex;align-items:flex-end;padding:var(--s-12)}
.p::before,.p::after{content:"";position:absolute;border-radius:inherit}
.p::before{inset:calc(-1*var(--rim)) 0 0 0;background:var(--coral)}
.p::after{inset:0;background:var(--verde)}
.p>*{position:relative;z-index:1}
h1{font-size:9vw;line-height:.86;letter-spacing:-.045em;text-transform:uppercase;color:var(--verde);padding:var(--s-8)}
</style></head>
<body><div class="p"><p>TESIS</p></div><h1>José Fernandez</h1></body>
</html>
